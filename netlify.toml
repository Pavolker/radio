[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Redirects de API para as Netlify Functions
[[redirects]]
  from = "/api/radio/status"
  to = "/.netlify/functions/radio-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/radio/catalog"
  to = "/.netlify/functions/radio-catalog"
  status = 200
  force = true

[[redirects]]
  from = "/api/radio/ai-host"
  to = "/.netlify/functions/radio-ai-host"
  status = 200
  force = true

# SPA fallback: tudo que não for arquivo vai para index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de CORS para as funções
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
